<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library — Mara Ellery</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="wordmark" href="index.html"><span>ME</span> Mara Ellery</a><nav class="nav-links"><a class="active" href="browse.html">Library</a><a href="index.html#about">About</a><a href="index.html#notes">Notes</a><a href="account.html">Reader account</a></nav><div class="header-actions"><button class="icon-button" data-theme>◐</button><a class="text-button" href="account.html">Reader account ↗</a></div></header><main class="page-wrap"><div class="page-intro"><p class="eyebrow">The library</p><h1>Stories to read<br><em>at your own pace.</em></h1><p>Browse the complete collection. No search, no noise — just the next good story.</p></div><div id="bookList" class="book-grid"></div></main><footer class="site-footer section-wrap"><a class="wordmark" href="index.html"><span>ME</span> Mara Ellery</a><p>© 2026 Mara Ellery · Made for quiet reading</p></footer><script src="data.js"></script><script src="site.js"></script><script>const list=document.querySelector('#bookList'); list.innerHTML=NOVELREAD.books.map(book=>`<article class="book-card"><div class="book-cover ${book.cover}"><span>${book.type} · ${book.status}</span><strong>${book.title.replace(' ', '<br>')}</strong><small>MARA ELLERY</small></div><div class="book-meta"><div><h3>${book.title}</h3><p>${book.type} · ${book.chapters} chapters</p></div><span class="status">${book.status}</span></div><p class="book-summary">${book.synopsis}</p><a class="read-link" href="read.html?book=${book.id}">Open book <span>↗</span></a></article>`).join('');</script></body></html>
