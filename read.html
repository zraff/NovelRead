<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading — Mara Ellery</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="wordmark" href="index.html"><span>ME</span> Mara Ellery</a><nav class="nav-links"><a href="browse.html">Library</a><a href="index.html#about">About</a><a href="index.html#notes">Notes</a><a href="account.html">Reader account</a></nav><div class="header-actions"><button class="icon-button" data-theme>◐</button><a class="text-button" href="account.html">Reader account ↗</a></div></header><main class="reading-shell"><aside class="toc-panel"><a class="back-link" href="browse.html">← Library</a><p class="eyebrow" id="bookType"></p><h1 id="bookTitle"></h1><p id="bookSynopsis" class="toc-synopsis"></p><div id="warnings"></div><p class="mono-label toc-label">Chapters</p><ol id="toc"></ol></aside><article class="chapter-panel"><div class="reader-settings"><span class="mono-label" id="progressLabel"></span><div><button id="fontDown">A−</button><button id="fontUp">A+</button><button data-theme>◐</button></div></div><div id="chapterContent"></div><div class="chapter-nav"><button class="button button-outline" id="prevChapter">← Previous</button><button class="button button-dark" id="nextChapter">Next chapter →</button></div><section class="comments"><p class="eyebrow">Chapter comments</p><h2>Leave a note for the author.</h2><p id="commentHint" class="muted"></p><form id="commentForm"><textarea id="commentText" maxlength="500" placeholder="What stayed with you?" required></textarea><button class="button button-dark" type="submit">Post comment <span>↗</span></button></form><div id="commentList"></div></section></article></main><script src="data.js"></script><script src="site.js"></script><script>
const params=new URLSearchParams(location.search), bookId=params.get('book')||'low-tide'; const book=NOVELREAD.books.find(b=>b.id===bookId)||NOVELREAD.books[0]; const chapters=NOVELREAD.chapters.filter(c=>c.bookId===book.id); let chapterNumber=Number(params.get('chapter'))||NovelRead.getProgress(book.id); let current=chapters.find(c=>c.number===chapterNumber)||chapters[0]; const $=s=>document.querySelector(s); $('#bookType').textContent=book.type+' · '+book.status; $('#bookTitle').textContent=book.title; $('#bookSynopsis').textContent=book.synopsis; $('#warnings').innerHTML=book.warnings.length?`<div class="warning-box"><span>Content notes</span>${book.warnings.join(' · ')}</div>`:''; $('#toc').innerHTML=chapters.map(c=>`<li class="${c.number===current.number?'selected':''}"><a href="?book=${book.id}&chapter=${c.number}">Chapter ${String(c.number).padStart(2,'0')}<strong>${c.title}</strong></a></li>`).join(''); $('#chapterContent').innerHTML=`<p class="eyebrow">Chapter ${String(current.number).padStart(2,'0')}</p><h2>${current.title}</h2>${current.body.map((p,i)=>`<p class="${i===0?'dropcap':''}">${p}</p>`).join('')}`; $('#progressLabel').textContent=book.title+' · '+current.number+' / '+chapters.length; NovelRead.saveProgress(book.id,current.number); const identity=NovelRead.getIdentity(); $('#commentHint').textContent=identity?`Commenting as ${identity.name}.`:'Sign in with a pseudonym to join the conversation.'; if(!identity) $('#commentForm').innerHTML='<a class="button button-dark" href="account.html">Sign in to comment <span>↗</span></a>'; $('#commentList').innerHTML=NovelRead.commentsFor(current.id).map(c=>`<div class="comment"><strong>${c.author}</strong><span>${c.at}</span><p>${c.text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</p></div>`).join(''); $('#commentForm').addEventListener('submit',e=>{e.preventDefault();const text=$('#commentText').value.trim();if(text){NovelRead.addComment(current.id,text);location.reload();}}); function go(n){const next=chapters.find(c=>c.number===n); if(next) location.href=`?book=${book.id}&chapter=${next.number}`; else NovelRead.toast('You reached the end of the available manuscript.');} $('#prevChapter').onclick=()=>go(current.number-1); $('#nextChapter').onclick=()=>go(current.number+1); let size=19; $('#fontUp').onclick=()=>{size=Math.min(size+2,28);$('.chapter-panel').style.setProperty('--reader-size',size+'px')}; $('#fontDown').onclick=()=>{size=Math.max(size-2,15);$('.chapter-panel').style.setProperty('--reader-size',size+'px')};
</script></body></html>
