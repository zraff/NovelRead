<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author sign in — NovelRead</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="wordmark" href="index.html"><span>NR</span> NovelRead</a><nav class="nav-links"><a href="browse.html">Library</a><a href="index.html#about">About</a><a href="privacy.html">Privacy</a></nav><div class="header-actions"><a class="text-button" href="index.html">Back to site ↗</a></div></header><main class="auth-wrap"><section><p class="eyebrow">Private author area</p><h1>Author<br><em>sign in.</em></h1><p class="account-lede">Manage books, chapters, comments, publishing, and reader analytics from the author studio.</p></section><section class="account-card auth-card"><form id="authorLogin"><label>Email<input id="authorEmail" type="email" autocomplete="username" required placeholder="Your author email"></label><label>Password<input id="authorPassword" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="button button-dark full-button" type="submit">Sign in to studio <span>↗</span></button></form><div class="auth-divider"><span>or</span></div><button class="button button-outline full-button" id="authorGoogle">Continue with Google <span>↗</span></button><p id="authorMessage" class="fine-print"></p><p class="fine-print"><a href="account.html">Reader sign in</a></p></section></main><div class="toast" id="toast"></div><script src="data.js"></script><script src="site.js"></script><script type="module">
const message=document.querySelector('#authorMessage'); const client=NovelRead.supabase||await new Promise(resolve=>window.addEventListener('novelread:connected',event=>resolve(event.detail),{once:true})); const fail=(text)=>{message.textContent=text;message.classList.add('error-text');}; if(!client){fail('Supabase is not connected. Check supabase-config.js.');} else { const session=(await client.auth.getSession()).data.session; if(session){const profile=(await client.from('reader_profiles').select('is_author').eq('id',session.user.id).maybeSingle()).data;if(profile?.is_author) location.href='admin.html';} document.querySelector('#authorLogin').onsubmit=async event=>{event.preventDefault();const result=await client.auth.signInWithPassword({email:document.querySelector('#authorEmail').value.trim(),password:document.querySelector('#authorPassword').value});if(result.error){fail(result.error.message);return;}const profile=(await client.from('reader_profiles').select('is_author').eq('id',result.data.user.id).maybeSingle()).data;if(!profile?.is_author){await client.auth.signOut();fail('This account is not marked as the author.');return;}location.href='admin.html';}; document.querySelector('#authorGoogle').onclick=async()=>{const result=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/author.html`}});if(result.error)fail(result.error.message);};}
</script></body></html>
